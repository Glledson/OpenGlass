[project]
name = "openglass"
version = "1.0.0"
description = "OpenGlass - ferramenta web de diagnostico de rede em roteadores de borda (fase 1: backend CLI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "netmiko>=4.7.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.0",
    "ruamel.yaml>=0.18.6",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
openglass = "openglass.cli:main"
openglass-web = "openglass.api:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
