<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGlass</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #161c33;
      --text: #e6ecff;
      --accent: #38bdf8;
      --accent2: #8b5cf6;
      --accent3: #22d3ee;
      --muted: color-mix(in srgb, var(--text) 60%, transparent);
      --border: color-mix(in srgb, var(--text) 14%, transparent);
      --field: color-mix(in srgb, var(--bg) 55%, var(--card));
      --ok: #22c55e;
      --err: #f87171;
      --warn: #f59e0b;
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fg: var(--text);
      --g-glow: color-mix(in srgb, var(--accent) 45%, transparent);
      --shadow-soft: 0 24px 60px -28px rgba(0, 0, 0, .85);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 520px at 12% -8%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 60%),
        radial-gradient(1000px 560px at 88% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
        radial-gradient(760px 460px at 50% 115%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 46px 18px 64px;
      position: relative;
      overflow-x: hidden;
    }

    /* grade sutil de fundo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
      -webkit-mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
    }

    /* orbes animados */
    body::after {
      content: "";
      position: fixed;
      inset: -40%;
      pointer-events: none;
      background:
        radial-gradient(420px 420px at 18% 22%, color-mix(in srgb, var(--accent3) 13%, transparent), transparent 60%),
        radial-gradient(520px 520px at 82% 30%, color-mix(in srgb, var(--accent2) 14%, transparent), transparent 62%);
      filter: blur(10px);
      animation: drift 26s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes drift {
      from {
        transform: translate3d(-2%, -1%, 0) rotate(0deg);
      }

      to {
        transform: translate3d(3%, 2%, 0) rotate(6deg);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    main {
      width: 100%;
      max-width: 900px;
    }

    /* ────────────────────────── Ícones SVG ────────────────────────── */
    .ic {
      width: 1.15em;
      height: 1.15em;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -0.18em;
      flex: none;
    }

    .ic-sm {
      width: .95em;
      height: .95em;
    }

    .ic-lg {
      width: 1.5em;
      height: 1.5em;
    }

    /* ────────────────────────── Hero ────────────────────────── */
    header.hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 32px;
      animation: fadeUp .5s ease both;
    }

    #logo {
      max-height: 280px;
      max-width: 510px;
      width: auto;
      height: auto;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .5));
      animation: logoGlow 4s ease-in-out infinite;
    }

    @keyframes logoGlow {

      0%,
      100% {
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .5)) drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 22%, transparent));
      }

      50% {
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .5)) drop-shadow(0 0 34px color-mix(in srgb, var(--accent) 55%, transparent));
      }
    }

    h1 {
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      background: linear-gradient(92deg, var(--text) 10%, var(--accent) 55%, var(--accent2));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleFlow 8s ease-in-out infinite;
    }

    @keyframes titleFlow {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: .95rem;
      max-width: 560px;
      line-height: 1.55;
    }

    /* ────────────────────────── Card ────────────────────────── */
    .card {
      background: color-mix(in srgb, var(--card) 86%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: relative;
      animation: fadeUp .55s .08s ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 45%, transparent), transparent 40%, color-mix(in srgb, var(--accent2) 35%, transparent));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    label .ic {
      color: var(--accent);
    }

    select,
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 38px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%236b7ba3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    input:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button#run {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      color: #04121e;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(95deg, var(--accent3), var(--accent) 55%, var(--accent2));
      background-size: 200% 100%;
      transition: background-position .3s, filter .18s, transform .06s, box-shadow .25s;
      box-shadow: 0 12px 34px -14px var(--g-glow);
    }

    button#run .ic {
      stroke-width: 2.4;
    }

    button#run:hover:not(:disabled) {
      background-position: 100% 0;
      filter: brightness(1.06);
      box-shadow: 0 16px 42px -14px color-mix(in srgb, var(--accent) 60%, transparent);
    }

    button#run:active:not(:disabled) {
      transform: translateY(1px);
    }

    button#run:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(4, 18, 30, .3);
      border-top-color: #04121e;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ────────────────────────── Status ────────────────────────── */
    #status {
      min-height: 20px;
      margin-top: 18px;
      font-size: .87rem;
      color: var(--muted);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    #status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      margin-top: 6px;
      flex: none;
    }

    #status:empty::before {
      display: none;
    }

    #status.err {
      color: var(--err);
    }

    #status.err::before {
      background: var(--err);
    }

    #status.ok {
      color: var(--ok);
    }

    #status.ok::before {
      background: var(--ok);
    }

    #status code {
      font-family: var(--mono);
      color: var(--accent);
    }

    #status.reserved {
      display: block;
      border: 1px solid color-mix(in srgb, var(--err) 50%, transparent);
      background: color-mix(in srgb, var(--err) 9%, transparent);
      border-radius: 12px;
      padding: 14px 16px;
    }

    #status.reserved::before {
      display: none;
    }

    .rfc-alert-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 750;
      color: var(--err);
    }

    .rfc-alert-title .ic {
      color: var(--err);
    }

    .rfc-alert-value {
      margin-top: 6px;
      font-family: var(--mono);
      font-weight: 700;
      word-break: break-all;
    }

    .rfc-alert-meta {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rfc-card {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: .76rem;
      color: var(--muted);
    }

    .rfc-card b {
      color: var(--accent);
    }

    /* ────────────────────────── Resultado ────────────────────────── */
    .result {
      margin-top: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: color-mix(in srgb, var(--bg) 82%, black);
      box-shadow: var(--shadow-soft);
      animation: fadeUp .45s ease both;
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 15px;
      background: color-mix(in srgb, var(--text) 6%, transparent);
      border-bottom: 1px solid var(--border);
    }

    .dots {
      display: inline-flex;
      gap: 6px;
    }

    .dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
    }

    .dots i:nth-child(1) {
      background: var(--err);
    }

    .dots i:nth-child(2) {
      background: var(--warn);
    }

    .dots i:nth-child(3) {
      background: var(--ok);
    }

    .result-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-right: auto;
    }

    #copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .76rem;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }

    #copy:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }

    pre#output {
      margin: 0;
      padding: 16px 18px;
      max-height: 480px;
      overflow: auto;
      font-family: var(--mono);
      font-size: .82rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ────────────────────────── Saída bruta ────────────────────────── */
    details.raw {
      border-top: 1px solid var(--border);
    }

    details.raw>summary {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      list-style: none;
      padding: 12px 16px;
      font-size: .74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      user-select: none;
      transition: color .15s;
    }

    details.raw>summary::-webkit-details-marker {
      display: none;
    }

    details.raw>summary .chev {
      transition: transform .18s;
    }

    details.raw[open]>summary .chev {
      transform: rotate(90deg);
    }

    details.raw>summary:hover {
      color: var(--accent);
    }

    /* ────────────────────────── Resultado tratado (ping) ────────────────────────── */
    .parsed {
      padding: 20px;
    }

    .ping-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .badge.success {
      color: #052e16;
      background: color-mix(in srgb, var(--ok) 92%, white);
      box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--ok) 80%, transparent);
    }

    .badge.partial {
      color: #3b2500;
      background: color-mix(in srgb, var(--warn) 90%, white);
      box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--warn) 80%, transparent);
    }

    .badge.failed {
      color: #450a0a;
      background: color-mix(in srgb, var(--err) 88%, white);
      box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--err) 80%, transparent);
    }

    .ping-pct {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }

    .ping-pct span {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
      margin-left: 6px;
    }

    .ping-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 36px;
      margin: 0 0 16px;
      padding: 0;
    }

    .ping-meta div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ping-meta dt {
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .ping-meta dd {
      margin: 0;
      font-family: var(--mono);
      font-size: .95rem;
    }

    .probes {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
    }

    .probe {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 750;
      font-size: .9rem;
      border: 1px solid var(--border);
      transition: transform .12s;
    }

    .probe:hover {
      transform: translateY(-2px);
    }

    .probe.reply {
      color: #052e16;
      background: color-mix(in srgb, var(--ok) 85%, white);
      border-color: transparent;
    }

    .probe.timeout {
      color: #450a0a;
      background: color-mix(in srgb, var(--err) 80%, white);
      border-color: transparent;
    }

    .probe.warn {
      color: #3b2500;
      background: color-mix(in srgb, var(--warn) 82%, white);
      border-color: transparent;
    }

    .ping-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: color-mix(in srgb, var(--field) 85%, transparent);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .64rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
    }

    .stat span .ic {
      color: var(--accent);
    }

    .stat strong {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .rtt h4 {
      margin: 0 0 10px;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .rtt-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      font-size: .8rem;
    }

    .rtt-row>span {
      color: var(--muted);
    }

    .rtt-track {
      height: 8px;
      border-radius: 99px;
      background: var(--field);
      overflow: hidden;
    }

    .rtt-track>i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ok)));
    }

    .rtt-row b {
      font-variant-numeric: tabular-nums;
    }

    .rtt-empty {
      color: var(--muted);
      font-size: .86rem;
      margin: 0;
    }

    /* ────────────────────────── Detalhe de prefixo BGP ────────────────────────── */
    .bgp-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bgp-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .bgp-prefix {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--mono);
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .bgp-prefix .ic {
      color: var(--accent);
    }

    .bgp-sub {
      font-size: .8rem;
      color: var(--muted);
    }

    /* ---------------- padrão de visualizador ---------------- */
    .vis-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .vis-title {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .vis-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.02rem;
      font-weight: 700;
    }

    .vis-name .ic {
      color: var(--accent);
    }

    .vis-sub {
      color: var(--muted);
      font-size: .78rem;
    }

    .vis-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .vis-table-wrap {
      max-height: 340px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--field) 60%, transparent);
    }

    .vis-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: .8rem;
    }

    .vis-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      text-align: left;
      font-family: var(--sans);
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      background: var(--card);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .vis-table td {
      padding: 6px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
      white-space: nowrap;
    }

    .vis-table tr:last-child td {
      border-bottom: none;
    }

    .vis-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .74rem;
    }

    /* ---------------- toolbar dos visualizadores interativos ---------------- */
    .vis-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }

    .vis-search,
    .vis-select {
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      font-size: .82rem;
      padding: 8px 11px;
      min-width: 0;
    }

    .vis-search {
      flex: 1 1 220px;
    }

    .vis-search:focus,
    .vis-select:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    }

    .vis-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .78rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .vis-count {
      margin-left: auto;
      color: var(--muted);
      font-size: .74rem;
      white-space: nowrap;
    }

    .vis-table th.sortable {
      cursor: pointer;
      user-select: none;
    }

    .vis-table th.sortable:hover {
      color: var(--accent);
    }

    /* ---------------- cadeia de AS ---------------- */
    .as-chains {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .as-chain-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--field) 55%, transparent);
      overflow: hidden;
    }

    .as-chain-row > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 11px 13px;
      cursor: pointer;
      list-style: none;
    }

    .as-chain-row > summary::-webkit-details-marker {
      display: none;
    }

    .as-chain-row > summary:hover {
      background: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    .as-chain {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-family: var(--mono);
      font-size: .82rem;
      min-width: 0;
    }

    .as-chip {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      white-space: nowrap;
    }

    .as-chip.hit {
      border-color: color-mix(in srgb, var(--accent) 70%, transparent);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      font-weight: 700;
    }

    .as-arrow {
      color: var(--muted);
      font-style: normal;
    }

    .as-chain.as-empty {
      font-style: italic;
      color: var(--muted);
    }

    .as-meta {
      color: var(--muted);
      font-size: .72rem;
    }

    .as-chain-row .vis-table-wrap {
      margin: 0 13px 13px;
      max-height: 240px;
    }

    .path-count {
      flex-shrink: 0;
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--field);
      font-size: .76rem;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .path-count .ic {
      color: var(--accent);
    }

    .path-more {
      margin: 18px 0 10px;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
    }

    .path-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 17px;
      background: color-mix(in srgb, var(--field) 85%, transparent);
      transition: transform .15s, border-color .15s, box-shadow .2s;
    }

    .path-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .7);
    }

    .path-card+.path-card {
      margin-top: 12px;
    }

    .path-card.best {
      border-color: color-mix(in srgb, var(--ok) 55%, var(--border));
      background: color-mix(in srgb, var(--ok) 9%, var(--field));
      box-shadow: 0 12px 30px -18px color-mix(in srgb, var(--ok) 55%, transparent);
    }

    /* Motivo da derrota, que só o VRP informa. Fica logo acima das flags para
       que a pergunta "por que este caminho não foi escolhido" seja lida antes
       dos atributos técnicos. */
    .path-lost {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: .8rem;
      color: var(--warn);
      background: color-mix(in srgb, var(--warn) 10%, transparent);
    }

    .path-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .84rem;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .path-card.best .path-head {
      color: var(--ok);
    }

    .path-star .ic {
      fill: var(--ok);
      stroke: var(--ok);
    }

    .path-idx {
      margin-left: auto;
      font-size: .72rem;
      font-weight: 650;
      color: var(--muted);
    }

    .path-attrs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 22px;
      margin: 0 0 12px;
    }

    .path-attrs div {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .path-attrs dt {
      font-size: .64rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
    }

    .path-attrs dd {
      margin: 0;
      font-size: .88rem;
      word-break: break-word;
    }

    .mono {
      font-family: var(--mono);
    }

    .muted {
      color: var(--muted);
      font-size: .82rem;
    }

    .flags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .flag {
      font-size: .68rem;
      font-weight: 650;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .flag-ok {
      color: var(--ok);
      border-color: color-mix(in srgb, var(--ok) 45%, transparent);
    }

    .flag-bad {
      color: var(--err);
      border-color: color-mix(in srgb, var(--err) 45%, transparent);
    }

    /* ────────────────────────── Traceroute ────────────────────────── */
    .tr-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 16px;
    }

    .tr-dest {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--fg);
      word-break: break-all;
    }

    .tr-dest .ic {
      align-self: center;
      color: var(--accent);
    }

    .tr-dest span {
      font-family: var(--sans);
      font-weight: 400;
      font-size: .78rem;
      color: var(--muted);
    }

    .tr-hops {
      font-size: .82rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tr-hops .ic {
      color: var(--accent);
    }

    .tr-hops-list {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
      gap: 6px;
    }

    .tr-hop {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--card) 85%, transparent);
      transition: transform .13s, border-color .15s;
    }

    .tr-hop:hover {
      transform: translateX(2px);
    }

    .tr-hop.last {
      border-color: color-mix(in srgb, var(--ok) 45%, transparent);
    }

    .tr-idx {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
      font-size: .82rem;
      font-weight: 750;
      flex: none;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .tr-hop.last .tr-idx {
      color: var(--ok);
      background: color-mix(in srgb, var(--ok) 15%, transparent);
      border-color: color-mix(in srgb, var(--ok) 25%, transparent);
    }

    .tr-ip {
      font-size: .9rem;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tr-ip .ic {
      color: var(--muted);
      font-size: 1em;
    }

    .tr-asn {
      font-size: .72rem;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 999px;
      padding: 2px 9px;
    }

    .tr-probes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-left: auto;
    }

    /* Next hop extra na mesma linha do salto: existe só no VRP, que repete o
       endereço quando cada sonda saiu por um caminho diferente. A contagem
       guarda os endereços no title para não alongar a linha do salto. */
    .tr-alt {
      align-self: center;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .66rem;
      color: var(--muted);
      cursor: help;
    }

    .tr-probe {
      font-size: .74rem;
      border-radius: 6px;
      padding: 2px 7px;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      border: 1px solid var(--border);
    }

    .tr-probe.tr-ok {
      color: var(--ok);
    }

    .tr-probe.tr-timeout {
      color: var(--muted);
    }

    .tr-probe.tr-err {
      color: var(--err);
    }

    .tr-avg {
      font-size: .78rem;
      color: var(--fg);
      border-left: 1px solid var(--border);
      padding-left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tr-avg.muted {
      color: var(--muted);
    }

    /* ────────────────────────── Rodapé / links ────────────────────────── */
    nav#links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 14px;
      margin-top: 34px;
      animation: fadeUp .5s .16s ease both;
    }

    nav#links a,
    nav#links button {
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: .84rem;
      text-decoration: none;
      cursor: pointer;
      transition: color .15s;
    }

    nav#links a:hover,
    nav#links button:hover {
      color: var(--accent);
    }

    nav#links .sep {
      color: var(--border);
    }

    #menus {
      max-width: 620px;
      margin: 14px auto 0;
    }

    .menu-panel {
      margin-top: 12px;
      background: color-mix(in srgb, var(--card) 86%, transparent);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 17px;
      font-size: .88rem;
      line-height: 1.55;
      white-space: pre-wrap;
      color: var(--text);
      backdrop-filter: blur(10px);
    }

    .menu-panel h3 {
      margin: 0 0 6px;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    footer.foot {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
    }

    .hidden {
      display: none !important;
    }

    /* scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }

    pre#output::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text) 14%, transparent);
      background-clip: content-box;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
    }

    @media (max-width: 620px) {
      .form {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.7rem;
      }

      #logo {
        max-height: 130px;
      }

      .ping-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .ping-pct {
        font-size: 1.3rem;
      }

      .card {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <header class="hero">
      <img id="logo" class="hidden" alt="logo">
      <h1 id="site-title">OpenGlass</h1>
      <p class="sub" id="subtitle"></p>
    </header>

    <section class="card">
      <form class="form" id="query-form">
        <div class="field">
          <label for="device"><svg class="ic ic-sm">
              <use href="#i-router" />
            </svg> Roteador</label>
          <select id="device"></select>
        </div>

        <div class="field">
          <label for="command"><svg class="ic ic-sm">
              <use href="#i-terminal" />
            </svg> Comando</label>
          <select id="command"></select>
        </div>

        <div class="field full" id="param-field">
          <label for="param" id="param-label"><svg class="ic ic-sm">
              <use href="#i-target" />
            </svg> IP</label>
          <input id="param" type="text" placeholder="8.8.8.8" autocomplete="off">
        </div>

        <button id="run" type="submit">
          <span class="spinner hidden" id="spinner"></span>
          <svg class="ic">
            <use href="#i-bolt" />
          </svg>
          <span id="run-label">Executar</span>
        </button>
      </form>
      <div id="status"></div>
    </section>

    <section class="result hidden" id="result">
      <div class="result-head">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="result-title"><svg class="ic ic-sm">
            <use href="#i-terminal" />
          </svg> Resultado</span>
        <button id="copy" type="button"><svg class="ic ic-sm">
            <use href="#i-copy" />
          </svg> Copiar</button>
      </div>
      <div id="parsed" class="parsed hidden"></div>
      <details class="raw" id="raw">
        <summary>
          <svg class="ic ic-sm chev">
            <use href="#i-chev" />
          </svg>
          <svg class="ic ic-sm">
            <use href="#i-terminal" />
          </svg>
          Ver saída bruta
        </summary>
        <pre id="output"></pre>
      </details>
    </section>

    <nav id="links"></nav>
    <div id="menus"></div>

    <footer class="foot" id="foot"></footer>
  </main>

  <script>
    const $device = document.getElementById("device");
    const $command = document.getElementById("command");
    const $paramLabel = document.getElementById("param-label");
    const $param = document.getElementById("param");
    const $form = document.getElementById("query-form");
    const $run = document.getElementById("run");
    const $runLabel = document.getElementById("run-label");
    const $spinner = document.getElementById("spinner");
    const $status = document.getElementById("status");
    const $result = document.getElementById("result");
    const $parsed = document.getElementById("parsed");
    const $raw = document.getElementById("raw");
    const $output = document.getElementById("output");
    const $copy = document.getElementById("copy");
    const $siteTitle = document.getElementById("site-title");
    const $subtitle = document.getElementById("subtitle");
    const $logo = document.getElementById("logo");
    const $links = document.getElementById("links");
    const $menus = document.getElementById("menus");
    const $foot = document.getElementById("foot");

    // Ícone inline: I("i-check", "ic ic-sm")
    function I(id, cls = "ic") {
      return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
    }

    const LABELS = { destination: "IP", ip: "IP", prefix: "Prefixo", hostname: "Host", asn: "AS (ou lista)", community: "Community" };
    let commands = [];
    // último resultado estruturado: a card de community re-renderiza a partir
    // dele a cada interação, sem voltar ao equipamento
    let lastParsed = null;

    async function api(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        const message =
          typeof detail === "string"
            ? detail
            : (detail && detail.message) || `Erro ${res.status}`;
        const err = new Error(message);
        if (detail && typeof detail === "object") {
          err.code = detail.code || null;
          err.meta = detail.meta || null;
        }
        throw err;
      }
      return data;
    }

    function rfcAlertHtml(meta) {
      const m = meta || {};
      return `
        <div class="rfc-alert-title">${I("i-shield")} Consulta bloqueada — faixa reservada</div>
        <div class="rfc-alert-value">${esc(m.requested)}</div>
        <div class="rfc-alert-meta">
          <span class="rfc-card"><b>${esc(m.rfc)}</b></span>
          <span class="rfc-card">${esc(m.network)}</span>
          <span class="rfc-card">${esc(m.purpose)}</span>
        </div>`;
    }

    function setStatus(text, kind) {
      $status.innerHTML = text || "";
      $status.className = kind || "";
    }

    function setLoading(active) {
      $run.disabled = active;
      $spinner.classList.toggle("hidden", !active);
      $runLabel.textContent = active ? "Executando..." : "Executar";
    }

    function applyTheme(theme) {
      const colors = (theme && theme.colors) || {};
      const root = document.documentElement.style;
      if (colors.background) root.setProperty("--bg", colors.background);
      if (colors.secondary) root.setProperty("--card", colors.secondary);
      if (colors.text) root.setProperty("--text", colors.text);
      if (colors.primary) root.setProperty("--accent", colors.primary);
    }

    function logoSrc(path) {
      if (!path) return "";
      return `/static/${path.replace(/^static\//, "")}`;
    }

    function renderSite(site) {
      document.title = site.site_title || "OpenGlass";
      $siteTitle.textContent = site.site_title || "OpenGlass";
      $subtitle.textContent = site.subtitle || site.site_description || "";

      const logoPath = (site.logo && (site.logo.light || site.logo.dark)) || "";
      if (logoPath && (site.title_mode || "").includes("logo")) {
        $logo.alt = site.site_title || "logo";
        $logo.onload = () => {
          $logo.classList.remove("hidden");
          $siteTitle.classList.add("hidden");
        };
        $logo.src = logoSrc(logoPath);
      }
      if (site.logo && site.logo.favicon) {
        const link = document.createElement("link");
        link.rel = "icon";
        link.href = logoSrc(site.logo.favicon);
        document.head.appendChild(link);
      }

      applyTheme(site.theme);

      const links = site.links || [];
      const menus = site.menus || [];
      const parts = ['<span class="sep">|</span>'];
      links.forEach((l, i) => {
        parts.push(`<a href="${l.url}" target="_blank" rel="noopener">${I("i-flag", "ic ic-sm")}${l.title}</a>`);
        if (i < links.length - 1) parts.push('<span class="sep">·</span>');
      });
      const menuButtons = menus
        .map((m, i) => `<button type="button" data-menu="${i}">${I("i-info", "ic ic-sm")}${m.title}</button>`)
        .join('<span class="sep">·</span>');
      $links.innerHTML = parts.join(" ") + (menus.length ? ` <span class="sep">|</span> ${menuButtons}` : "");

      $menus.innerHTML = menus
        .map(
          (m, i) =>
            `<div class="menu-panel hidden" id="menu-${i}"><h3>${m.title}</h3>${m.content}</div>`
        )
        .join("");
      $links.querySelectorAll("button[data-menu]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const panel = document.getElementById(`menu-${btn.dataset.menu}`);
          if (panel) panel.classList.toggle("hidden");
        });
      });

      const asn = site.primary_asn ? ` · AS${site.primary_asn}` : "";
      $foot.textContent = `${site.org_name || ""}${asn}`;
    }

    async function loadSite() {
      try {
        renderSite(await api("/api/site"));
      } catch (err) {
        console.warn("Falha ao carregar openglass.yaml:", err.message);
      }
    }

    function currentParam() {
      const cmd = commands.find((c) => c.name === $command.value);
      return cmd && cmd.params.length ? cmd.params[0] : null;
    }

    function renderParamField() {
      const param = currentParam();
      if (!param) {
        $paramLabel.innerHTML = `${I("i-target", "ic ic-sm")} IP`;
        $param.placeholder = "este comando não usa parâmetro";
        $param.value = "";
        $param.disabled = true;
        return;
      }
      $paramLabel.innerHTML = `${I("i-target", "ic ic-sm")} ${LABELS[param.type] || param.name}`;
      $param.placeholder = param.type === "prefix" ? "8.8.8.0/24" : "8.8.8.8";
      $param.disabled = false;
    }

    async function loadCommands() {
      const name = $device.value;
      if (!name) return;
      setStatus("Carregando comandos...");
      try {
        commands = await api(`/api/devices/${encodeURIComponent(name)}/commands`);
        $command.innerHTML = commands
          .map((c) => `<option value="${c.name}">${c.description}</option>`)
          .join("");
        renderParamField();
        setStatus("");
      } catch (err) {
        commands = [];
        $command.innerHTML = "";
        setStatus(err.message, "err");
      }
    }

    async function loadDevices() {
      setStatus("Carregando roteadores...");
      try {
        const devices = await api("/api/devices");
        $device.innerHTML = devices
          .map((d) => `<option value="${d.name}">${d.name}</option>`)
          .join("");
        setStatus("");
        await loadCommands();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    const PROBE_STYLE = {
      reply: { cls: "reply", icon: "i-check" },
      timeout: { cls: "timeout", icon: "i-x" },
      unreachable: { cls: "warn", icon: "i-warn" },
    };

    // ---------------------------------------------------------------------
    // Padrão de visualizador
    //
    // Todo comando com `parser:` devolve `parsed.type`. O visualizador é a
    // funçãoregistered nesse mapa, e todas seguem o mesmo contrato:
    //
    //   1. cabeçalho  → `visHead({icon, title, sub, badge})`
    //   2. números    → `visStats([{label, value, icon}])`
    //   3. detalhe    → livre, mas usando `visTable`/`visEmpty`/`asChain`
    //   4. estado vazio→ `visEmpty(msg)` (nunca HTML vazio)
    //
    // Para adicionar um: escreva a card, registre em VISUALIZERS com o mesmo
    // `type` que o parser devolve, e pronto — `renderParsed` a encontra sozinha.
    // ---------------------------------------------------------------------
    const VISUALIZERS = {
      ping: pingCard,
      traceroute: tracerouteCard,
      bgp_prefix: bgpPrefixCard,
      bgp_as_path: asPathCard,
      bgp_community: communityCard,
    };

    const ORIGIN_LABELS = { i: "IGP", e: "EGP", "?": "incompleto" };

    // Communities bem conhecidas (RFC 1997 e afins). O IOS aceita esses nomes
    // no filtro, então a consulta pode ter sido feita por nome e não por número.
    const COMMUNITY_LABELS = {
      "no-export": "não anunciar fora da AS",
      "no-advertise": "não anunciar para nenhum peer",
      "internet": "divulgável na internet",
      "local-AS": "somente dentro da AS",
      "no-export-subconfed": "não anunciar fora da subconfederação",
    };

    function communityLabel(value) {
      const key = String(value || "").toLowerCase();
      return COMMUNITY_LABELS[key] || "community numérica";
    }

    function visHead({ icon, title, sub, badge, badgeCls }) {
      return `
        <div class="vis-head">
          <div class="vis-title">
            <span class="vis-name">${icon ? I(icon) : ""}${esc(title)}</span>
            ${sub ? `<span class="vis-sub">${esc(sub)}</span>` : ""}
          </div>
          ${badge ? `<span class="badge ${badgeCls || ""}">${badge}</span>` : ""}
        </div>`;
    }

    function visStats(stats) {
      const tiles = (stats || [])
        .filter(Boolean)
        .map((s) => `
          <div class="stat"><span>${s.icon ? I(s.icon, "ic ic-sm") : ""} ${esc(s.label)}</span><strong>${esc(s.value)}</strong></div>`)
        .join("");
      return tiles ? `<div class="vis-stats">${tiles}</div>` : "";
    }

    function visTable({ columns, rows, empty }) {
      if (!rows || !rows.length) return visEmpty(empty || "Nada a exibir.");
      const head = columns
        .map((c) => (c.sortable
          ? `<th class="sortable" data-sort="${esc(c.key)}">${esc(c.label)}</th>`
          : `<th>${esc(c.label)}</th>`))
        .join("");
      const body = rows
        .map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`)
        .join("");
      return `<div class="vis-table-wrap"><table class="vis-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function visEmpty(message) {
      return `<p class="rtt-empty">${esc(message)}</p>`;
    }

    // Cadeia de AS: cada salto é um chip e as setas dão a direção do caminho.
    // `highlight` marca o(s) AS pesquisado(s).
    function asChain(asPath, highlight) {
      const list = Array.isArray(asPath) ? asPath : [];
      if (!list.length) return `<span class="as-chain as-empty">rota local</span>`;
      const marked = new Set(
        String(highlight || "")
          .split(/[,\s]+/)
          .filter(Boolean),
      );
      return `<span class="as-chain">${list
        .map((as, i) => {
          const cls = marked.has(as) ? "as-chip hit" : "as-chip";
          const arrow = i ? `<i class="as-arrow">›</i>` : "";
          return `${arrow}<span class="${cls}">${esc(as)}</span>`;
        })
        .join("")}</span>`;
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // Cada sonda vira um chip. O IOS só diz se a sonda respondeu ou expirou
    // (`!!!!!` / `.....`), mas o VRP imprime TTL e tempo de cada uma — então o
    // title é montado com o que houver: um timeout fica sem tempo, porque
    // inventar 0 ms faria a sonda parecer a mais rápida da fileira.
    function probeChip(probe) {
      const style = PROBE_STYLE[probe.result] || { cls: "warn", icon: "i-warn" };
      const detail = [probe.label];
      if (probe.ttl != null) detail.push(`TTL ${probe.ttl}`);
      if (probe.time_ms != null) detail.push(`${probe.time_ms} ms`);
      return `<span class="probe ${style.cls}" title="${esc(detail.join(" · "))}">${I(style.icon)}</span>`;
    }

    function pingCard(p) {
      const badges = {
        success: ["success", `${I("i-check")} Sucesso`],
        partial: ["partial", `${I("i-warn")} Parcial`],
        failed: ["failed", `${I("i-x")} Falha`],
      };
      const [badgeCls, badgeText] = badges[p.status] || ["partial", esc(p.status)];

      const meta = [
        `<div><dt>Destino</dt><dd>${esc(p.target || "—")}</dd></div>`,
        p.source ? `<div><dt>Origem</dt><dd>${esc(p.source)}</dd></div>` : "",
      ].join("");

      let latency = `<p class="rtt-empty">Sem resposta — não foi possível medir a latência.</p>`;
      const rtt = p.rtt_ms;
      if (rtt) {
        const max = Math.max(rtt.min, rtt.avg, rtt.max, 1);
        const row = (label, value) => `
          <div class="rtt-row">
            <span>${label}</span>
            <div class="rtt-track"><i style="width:${Math.round((value / max) * 100)}%"></i></div>
            <b>${value} ms</b>
          </div>`;
        latency = `<div class="rtt">
          <h4>${I("i-clock", "ic ic-sm")} Latência (ida e volta)</h4>
          ${row("min", rtt.min)}${row("média", rtt.avg)}${row("máx", rtt.max)}
        </div>`;
      }

      const stat = (icon, label, value) => `
        <div class="stat"><span>${icon} ${label}</span><strong>${value}</strong></div>`;

      return `
        <div class="ping-head">
          <span class="badge ${badgeCls}">${badgeText}</span>
          <span class="ping-pct">${p.success_percent}<span>% de sucesso</span></span>
        </div>
        <dl class="ping-meta">${meta}</dl>
        <div class="probes">${(p.probes || []).map(probeChip).join("")}</div>
        <div class="ping-stats">
          ${stat(I("i-ping", "ic ic-sm"), "Enviados", p.sent)}
          ${stat(I("i-check", "ic ic-sm"), "Recebidos", p.received)}
          ${stat(I("i-warn", "ic ic-sm"), "Perda", p.loss_percent + "%")}
          ${stat(I("i-clock", "ic ic-sm"), "Tempo limite", p.timeout_s != null ? p.timeout_s + "s" : "—")}
        </div>
        ${latency}`;
    }

    const FLAG_OK = new Set(["valid", "best", "sourced", "local", "multipath"]);
    const FLAG_BAD = new Set(["invalid", "stale", "history", "withdrawn", "suppressed", "damped", "rib-failure"]);

    function flagClass(flag) {
      const key = flag.toLowerCase();
      if (FLAG_OK.has(key)) return "flag-ok";
      if (FLAG_BAD.has(key)) return "flag-bad";
      return "";
    }

    function flagChips(flags) {
      return (flags || [])
        .map((flag) => `<span class="flag ${flagClass(flag)}">${esc(flag)}</span>`)
        .join("");
    }

    function pathCard(path, isBest) {
      const attrs = [];
      if (path.localpref != null) attrs.push(`localpref ${path.localpref}`);
      if (path.metric != null) attrs.push(`metric ${path.metric}`);
      if (path.weight != null) attrs.push(`weight ${path.weight}`);
      // `pref-val` do VRP é o valor de preferência do caminho (maior melhor),
      // não a métrica do IOS. Aparece com o nome do VRP em vez de reaproveitar
      // `metric`: os dois números não se comparam, e somar as duas coisas na
      // mesma linha diria que medem a mesma grandeza.
      if (path.pref_val != null) attrs.push(`pref-val ${path.pref_val}`);
      const originLine = [path.origin, ...attrs].filter(Boolean).join(" · ");

      const hasFrom = path.from && path.from !== "0.0.0.0";
      const from = hasFrom
        ? ` <span class="muted">(de ${esc(path.from)}${path.originator ? ` / ${esc(path.originator)}` : ""})</span>`
        : "";
      const aggregations = (path.aggregations || [])
        .map((a) => `<div><dt>Agregação</dt><dd class="mono">AS${esc(a.asn)} ${esc(a.router)}</dd></div>`)
        .join("");

      // Campos que só o VRP devolve. Todos condicionais: a card do IOS não
      // muda um caractere porque eles não existem lá.
      const interfaceRow = path.out_interface
        ? `<div><dt>Interface</dt><dd class="mono">${esc(path.out_interface)}</dd></div>`
        : "";
      const durationRow = path.duration
        ? `<div><dt>Na tabela há</dt><dd>${esc(path.duration)}</dd></div>`
        : "";
      const communities = (path.communities || []).length
        ? `<div><dt>Communities</dt><dd class="mono">${path.communities
            .map((c) => esc(c))
            .join(", ")}</dd></div>`
        : "";

      // O porquê da derrota. Com dois caminhos para o mesmo prefixo, é a
      // pergunta que o operador faz primeiro, e o VRP responde na saída
      // ("not preferred for router ID") enquanto o IOS não responde nada.
      const lost = path.not_preferred
        ? `<div class="path-lost">${I("i-warn", "ic ic-sm")} não preferido por ${esc(path.not_preferred)}</div>`
        : "";

      const headIcon = isBest
        ? `<span class="path-star">${I("i-star")}</span> Melhor caminho`
        : `${I("i-route", "ic ic-sm")} Caminho`;

      return `
        <div class="path-card ${isBest ? "best" : ""}">
          <div class="path-head">
            ${headIcon}
            <span class="path-idx">#${path.index}</span>
          </div>
          <dl class="path-attrs">
            <div><dt>AS path</dt><dd class="mono">${esc(path.as_path_text || "—")}</dd></div>
            <div><dt>Next hop</dt><dd class="mono">${esc(path.next_hop)}${from}</dd></div>
            <div><dt>Origem</dt><dd>${esc(originLine || "—")}</dd></div>
            ${interfaceRow}
            ${durationRow}
            ${communities}
            ${aggregations}
          </dl>
          ${lost}
          <div class="flags">${flagChips(path.flags)}</div>
        </div>`;
    }

    function bgpPrefixCard(p) {
      if (p.status === "not_found") {
        return `
          <div class="bgp">
            <div class="bgp-head">
              <div class="bgp-title">
                <span class="bgp-prefix">${I("i-route")}${esc(p.prefix || "?")}</span>
                <span class="bgp-sub">consulta de detalhe BGP</span>
              </div>
              <span class="badge partial">${I("i-warn")} Não encontrado</span>
            </div>
            <p class="rtt-empty">O prefixo não está na tabela BGP deste roteador.</p>
          </div>`;
      }

      const paths = p.paths || [];
      const best = paths.find((path) => path.best);
      const others = paths.filter((path) => path !== best);
      const advertise =
        p.advertised === false
          ? "não anunciado"
          : p.advertised && (p.update_groups || []).length
            ? `anunciado (ug ${p.update_groups.join(", ")})`
            : "";
      const sub = [
        p.version != null ? `versão ${p.version}` : "",
        p.table ? `tabela ${esc(p.table)}` : "",
        // o VRP não versiona a entrada nem nomeia a tabela, então esses dois
        // campos acima ficam vazios. AS local e router ID são o que ele
        // devolve no lugar, e sem eles o cabeçalho do VRP ficava sem contexto
        p.local_as ? `AS ${esc(p.local_as)}` : "",
        p.router_id ? `router ID ${esc(p.router_id)}` : "",
        advertise,
      ].filter(Boolean).join(" · ");

      return `
        <div class="bgp">
          <div class="bgp-head">
            <div class="bgp-title">
              <span class="bgp-prefix">${I("i-route")}${esc(p.prefix || "?")}</span>
              <span class="bgp-sub">${sub}</span>
            </div>
            <span class="path-count">${I("i-star", "ic ic-sm")}${p.available} path${p.available === 1 ? "" : "s"}</span>
          </div>
          ${best ? pathCard(best, true) : ""}
          ${others.length
          ? `<div class="path-more">Outros caminhos (${others.length})</div>${others
            .map((path) => pathCard(path, false))
            .join("")}`
          : ""}
        </div>`;
    }

    function trProbes(times) {
      return (times || [])
        .map((probe) => {
          if (probe.type === "reply") {
            return `<span class="tr-probe tr-ok">${probe.ms} ms</span>`;
          }
          if (probe.type === "timeout") {
            return `<span class="tr-probe tr-timeout" title="sem resposta">${I("i-x", "ic ic-sm")}</span>`;
          }
          return `<span class="tr-probe tr-err" title="falha (${esc(probe.code)})">${esc(probe.code)}</span>`;
        })
        .join("");
    }

    function trHopRow(hop, isLast) {
      const asn = hop.asn != null ? `<span class="tr-asn">AS ${hop.asn}</span>` : "";
      const avg =
        hop.avg_ms != null
          ? `<span class="tr-avg">${hop.avg_ms} ms</span>`
          : `<span class="tr-avg muted">sem resposta</span>`;
      return `
        <div class="tr-hop ${isLast ? "last" : ""}">
          <span class="tr-idx">${hop.hop}</span>
          <span class="tr-ip mono">${I("i-hop", "ic ic-sm")}${hop.ip ? esc(hop.ip) : "—"}</span>
          ${trAltHops(hop)}
          ${asn}
          <span class="tr-probes">${trProbes(hop.times)}</span>
          ${avg}
        </div>`;
    }

    // Caminho alternativo do salto. No IOS o next hop é um só por salto, então
    // `addresses` não existe; no VRP a mesma linha pode trazer um endereço por
    // sonda, e o primeiro é o que já aparece na coluna. O extras entram como
    // lista, com a contagem no title, para não esconder quantos são.
    function trAltHops(hop) {
      const extras = (hop.addresses || []).slice(1);
      if (!extras.length) return "";
      const titulo = `outro next hop na mesma linha: ${extras.join(", ")}`;
      return `<span class="tr-alt mono" title="${esc(titulo)}">+${extras.length}</span>`;
    }

    function tracerouteCard(p) {
      const badges = {
        success: ["success", `${I("i-check")} Chegou ao destino`],
        partial: ["partial", `${I("i-warn")} Incompleto`],
        failed: ["failed", `${I("i-x")} Sem resposta`],
        unreachable: ["failed", `${I("i-x")} Inalcançável`],
      };
      const [badgeCls, badgeText] = badges[p.status] || ["partial", esc(p.status)];
      const hops = p.hops || [];

      return `
        <div class="tr">
          <div class="tr-head">
            <span class="badge ${badgeCls}">${badgeText}</span>
            <span class="tr-dest">${I("i-dest")}<span>Destino</span>${esc(p.destination || "?")}</span>
            <span class="tr-hops">${I("i-traceroute", "ic ic-sm")}${hops.length} salto${hops.length === 1 ? "" : "s"}</span>
          </div>
          <div class="tr-hops-list">
            ${hops.map((hop, index) => trHopRow(hop, index === hops.length - 1)).join("")}
            ${!hops.length ? `<p class="rtt-empty">Nenhum salto respondeu ao traceroute.</p>` : ""}
          </div>
        </div>`;
    }

    // Visualizador de community: o filtro já devolveu os prefixos, e a saída
    // não repete a community. A pergunta útil é quem está anunciando com ela,
    // então as linhas vêm aplanadas por AS de origem — a borda que vaza a
    // community — e toda a interação acontece no cliente, sem sondar o
    // equipamento de novo.
    function communityRows(p) {
      const rows = [];
      (p.origins || []).forEach((origin) => {
        (origin.entries || []).forEach((entry) => {
          rows.push({
            origin_as: origin.is_local ? "" : origin.origin_as,
            local: !!origin.is_local,
            prefix: entry.prefix,
            next_hop: entry.next_hop,
            best: !!entry.best,
            communities: (entry.communities || []).join(" "),
            chain: (origin.next_hops || []).join(", "),
          });
        });
      });
      return rows;
    }

    // Filtro/ordenação/expansão vivem fora do render: a card é reescrita a cada
    // interação, então guardar o estado em `communityView` faz a tabela não
    // perder a busca nem a coluna ordenada.
    const communityView = { term: "", sort: "origin_as", dir: 1, asFilter: "", bestOnly: false };

    const COMMUNITY_COLUMNS = [
      { key: "origin_as", label: "AS de origem", sort: "text" },
      { key: "prefix", label: "Prefixo", sort: "text" },
      { key: "next_hop", label: "Next hop", sort: "text" },
      { key: "best", label: "Best", sort: "bool" },
    ];

    // Só o VRP devolve a community de cada prefixo: a saída dele tem coluna
    // `Community`, e o IOS repete o filtro no AS path em vez de mostrar a lista.
    // A coluna entra quando o dado existe, para a card do IOS não ganhar uma
    // célula vazia.
    function communityColumns(p) {
      const temCommunities = (p.origins || []).some((o) =>
        (o.entries || []).some((e) => e.communities && e.communities.length)
      );
      if (!temCommunities) return COMMUNITY_COLUMNS;
      return [
        COMMUNITY_COLUMNS[0],
        COMMUNITY_COLUMNS[1],
        { key: "communities", label: "Communities", sort: "text" },
        COMMUNITY_COLUMNS[2],
        COMMUNITY_COLUMNS[3],
      ];
    }

    function communityMatches(row, view) {
      if (view.bestOnly && !row.best) return false;
      if (view.asFilter && row.origin_as !== view.asFilter) return false;
      if (!view.term) return true;
      const needle = view.term.toLowerCase();
      return (
        row.prefix.toLowerCase().includes(needle) ||
        row.next_hop.toLowerCase().includes(needle) ||
        row.origin_as.includes(needle) ||
        (row.communities || "").toLowerCase().includes(needle)
      );
    }

    function communitySort(rows, view) {
      const key = view.sort;
      const factor = view.dir;
      return rows.slice().sort((a, b) => {
        // best é booleano: com dir -1 os TRUE (osPrefixo interessa) vêm primeiro
        if (key === "best") {
          return ((a.best ? 0 : 1) - (b.best ? 0 : 1)) * factor;
        }
        if (key === "next_hop") {
          return a.next_hop.localeCompare(b.next_hop, "pt-BR", { numeric: true }) * factor;
        }
        if (key === "origin_as") {
          // rota local antes de qualquer AS ao ordenar crescente
          const rank = (r) => (r.local ? "" : r.origin_as);
          return rank(a).localeCompare(rank(b), "pt-BR", { numeric: true }) * factor;
        }
        return a[key].localeCompare(b[key], "pt-BR", { numeric: true }) * factor;
      });
    }

    function communityToolbar(p, view, shown, total) {
      const asns = (p.origins || [])
        .map((o) => (o.is_local ? "" : o.origin_as))
        .filter(Boolean);
      const options = [`<option value="">todos os ASs (${asns.length})</option>`]
        .concat(
          asns.map((asn) => `<option value="${esc(asn)}"${view.asFilter === asn ? " selected" : ""}>AS ${esc(asn)}</option>`),
        )
        .join("");
      return `
        <div class="vis-toolbar">
          <input
            type="search"
            class="vis-search"
            id="community-search"
            placeholder="filtrar por prefixo, next hop ou AS"
            value="${esc(view.term)}"
            autocomplete="off"
          >
          <select class="vis-select" id="community-as">${options}</select>
          <label class="vis-toggle">
            <input type="checkbox" id="community-best"${view.bestOnly ? " checked" : ""}>
            só best path
          </label>
          <span class="vis-count" id="community-count">${shown} de ${total} prefixo${total === 1 ? "" : "s"}</span>
        </div>`;
    }

    function communityCard(p) {
      const searched = p.community || "";
      const view = communityView;

      const head = visHead({
        icon: "i-flag",
        title: "BGP Community",
        sub: searched ? `${searched} · ${communityLabel(searched)}` : "busca por community",
        badge: `${p.total_prefixes} prefixo${p.total_prefixes === 1 ? "" : "s"}`,
      });

      const stats = visStats([
        { label: "Rotas", value: p.total_paths, icon: "i-route" },
        { label: "ASs anunciando", value: p.origin_count, icon: "i-router" },
        {
          label: p.total_paths === p.total_prefixes ? "Prefixos" : "Prefixos distintos",
          value: p.total_prefixes,
          icon: "i-dest",
        },
        { label: "Best path", value: p.best_paths, icon: "i-check" },
      ]);

      if (!communityRows(p).length) {
        return head + stats + visEmpty("Nenhum prefixo casou a community.");
      }

      // o toolbar nasce uma vez so; filtrar e ordenar troca so o corpo, para
      // nao destruir o campo de busca no meio da digitacao
      const shown = communityFiltered(p, view).length;
      return (
        head +
        stats +
        communityToolbar(p, view, shown, communityRows(p).length) +
        `<div id="community-body">${communityBody(p, view)}</div>`
      );
    }

    function communityFiltered(p, view) {
      const all = communityRows(p);
      return communitySort(all.filter((row) => communityMatches(row, view)), view);
    }

    // So a tabela. Puro: nao toca no DOM, o contador quem atualiza e o refresh.
    function communityBody(p, view) {
      const body = communityFiltered(p, view);
      // A celula de communities e a coluna saem da MESMA condicao: emitir a
      // celula sem a coluna desalinha a tabela, e vice-versa.
      const cols = communityColumns(p);
      const comCommunities = cols.length > COMMUNITY_COLUMNS.length;

      const table = visTable({
        columns: cols.map((c) => ({
          key: c.key,
          label: c.key === view.sort ? `${c.label} ${view.dir < 0 ? "↓" : "↑"}` : c.label,
          sortable: true,
        })),
        rows: body.map((row) => {
          const celulas = [
            row.local
              ? `<span class="as-chip">local</span>`
              : `<span class="as-chip">AS ${esc(row.origin_as)}</span>`,
            esc(row.prefix),
          ];
          if (comCommunities) {
            celulas.push(row.communities ? `<span class="mono">${esc(row.communities)}</span>` : "");
          }
          celulas.push(esc(row.next_hop), row.best ? `<span class="badge success">best</span>` : "");
          return celulas;
        }),
        empty: "Nenhuma rota casa com o filtro.",
      });

      const notes = [];
      if (p.capped_origins) notes.push(`Exibindo os ${(p.origins || []).length} ASs com mais rotas de ${p.origin_count}`);
      if (p.capped_prefixes) notes.push("a lista de prefixos de alguns ASs foi truncada");
      const note = notes.length
        ? `<p class="vis-note">${esc(notes.join("; "))}. Use a saída bruta para ver tudo.</p>`
        : "";

      return table + note;
    }

    // Visualizador de AS Path: agrupa os prefixos por caminho, porque a
    // pergunta real é "quem passa por este AS" e não "liste 9 mil prefixos".
    function asPathCard(p) {
      const chains = p.chains || [];
      const searched = p.asn || "";
      const shown = chains.reduce((sum, c) => sum + c.paths, 0);
      const capped = p.capped_chains || p.capped_prefixes;

      const head = visHead({
        icon: "i-traceroute",
        title: "BGP AS Path",
        sub: searched ? `AS ${searched}` : "busca por caminho",
        badge:
          p.total_paths === p.total_prefixes
            ? `${p.total_prefixes} prefixo${p.total_prefixes === 1 ? "" : "s"}`
            : `${p.total_prefixes} prefixos · ${p.total_paths} rotas`,
      });

      const stats = visStats([
        {
          label: p.total_paths === p.total_prefixes ? "Prefixos" : "Rotas",
          value: p.total_paths === p.total_prefixes ? p.total_prefixes : p.total_paths,
          icon: "i-route",
        },
        p.total_paths === p.total_prefixes
          ? null
          : { label: "Prefixos distintos", value: p.total_prefixes, icon: "i-dest" },
        { label: "Caminhos distintos", value: p.unique_chains, icon: "i-hop" },
        { label: "Maior caminho", value: p.longest_path, icon: "i-chev" },
        { label: "ASs envolvidos", value: p.asn_count, icon: "i-star" },
      ]);

      if (!chains.length) {
        return head + stats + visEmpty("Nenhum caminho casou a busca.");
      }

      const body = chains
        .map((chain, index) => {
          const origin = ORIGIN_LABELS[chain.origin] || chain.origin || "—";
          const label = chain.is_local
            ? "rota local"
            : `${chain.as_path.length} salto${chain.as_path.length === 1 ? "" : "s"}`;
          return `
            <details class="as-chain-row"${index === 0 ? " open" : ""}>
              <summary>
                ${asChain(chain.as_path, searched)}
                <span class="as-meta">${esc(label)} · origem ${esc(origin)}</span>
                <span class="path-count">${chain.paths} rota${chain.paths === 1 ? "" : "s"}</span>
              </summary>
              ${visTable({
                columns: ["Prefixo"],
                rows: (chain.prefixes || []).map((prefix) => [esc(prefix)]),
                empty: "Nenhum prefixo listado.",
              })}
            </details>`;
        })
        .join("");

      const note = capped
        ? `<p class="vis-note">Exibindo os ${chains.length} caminhos mais frequentes` +
          `${p.capped_prefixes ? ", com até 250 prefixos por caminho" : ""} de ` +
          `${p.unique_chains}. Use a saída bruta para ver tudo.</p>`
        : shown < p.total_paths
          ? `<p class="vis-note">Mostrando ${shown} de ${p.total_paths} rotas.</p>`
          : "";

      return head + stats + `<div class="as-chains">${body}</div>` + note;
    }

    function renderParsed(parsed) {
      if (!parsed) {
        lastParsed = null;
        $parsed.innerHTML = "";
        $parsed.classList.add("hidden");
        return;
      }
      const render = VISUALIZERS[parsed.type];
      if (!render) {
        // tipo sem visualizador: mostra o estruturado como tabela, sem quebrar
        $parsed.innerHTML =
          visHead({ title: parsed.type, sub: "sem visualizador" }) +
          visTable({
            columns: ["campo", "valor"],
            rows: Object.entries(parsed).map(([k, v]) => [
              esc(k),
              esc(JSON.stringify(v)),
            ]),
          });
        $parsed.classList.remove("hidden");
        return;
      }
      lastParsed = parsed;
      if (parsed.type === "bgp_community") {
        // resultado novo nao tem relacao com o filtro da consulta anterior, e o
        // reset mora aqui para nao depender de quem disparou a consulta
        Object.assign(communityView, {
          term: "",
          asFilter: "",
          bestOnly: false,
          sort: "origin_as",
          dir: 1,
        });
      }
      $parsed.innerHTML = render(parsed);
      $parsed.classList.remove("hidden");
    }

    async function execute(event) {
      if (event) event.preventDefault();
      const param = currentParam();
      const params = {};
      if (param) {
        const value = $param.value.trim();
        if (!value) {
          setStatus(`Informe o ${$paramLabel.textContent}.`, "err");
          $param.focus();
          return;
        }
        params[param.name] = value;
      }

      $result.classList.add("hidden");
      setLoading(true);
      setStatus("Executando no roteador... (pode levar alguns segundos)");

      try {
        const result = await api("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: $device.value, command: $command.value, params }),
        });
        setStatus("");
        $output.textContent = result.output;
        if (result.truncated) {
          setStatus(
            `Saída grande: ${result.line_count} linhas. ` +
            "A tela pode demorar a renderizar — use Copiar para levar o texto inteiro.",
          );
        }
        renderParsed(result.parsed);
        $raw.open = false;
        $result.classList.remove("hidden");
      } catch (err) {
        if (err.code === "reserved_range") {
          setStatus(rfcAlertHtml(err.meta), "reserved");
        } else {
          setStatus(err.message, "err");
        }
      } finally {
        setLoading(false);
      }
    }

    $copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($output.textContent || "");
        $copy.textContent = "Copiado!";
        setTimeout(() => { $copy.innerHTML = `${I("i-copy", "ic ic-sm")} Copiar`; }, 1500);
      } catch (err) {
        setStatus("Não foi possível copiar.", "err");
      }
    });

    // Controles da card de community nascem a cada render, então a delegated
    // escuta num listener só em vez de religar evento a cada consulta.
    $parsed.addEventListener("input", (event) => {
      const target = event.target;
      if (target.id === "community-search") {
        communityView.term = target.value;
        refreshCommunity();
      }
    });

    $parsed.addEventListener("change", (event) => {
      const target = event.target;
      if (target.id === "community-as") {
        communityView.asFilter = target.value;
        refreshCommunity();
      } else if (target.id === "community-best") {
        communityView.bestOnly = target.checked;
        refreshCommunity();
      }
    });

    $parsed.addEventListener("click", (event) => {
      const head = event.target.closest("th.sortable");
      if (!head || !lastParsed || lastParsed.type !== "bgp_community") return;
      const key = head.dataset.sort;
      // clicar na coluna ja ordenada inverte; senao comeca crescente (A→Z).
      // em `best` crescente ja traz os TRUE primeiro, que e o que interessa.
      if (communityView.sort === key) {
        communityView.dir = -communityView.dir;
      } else {
        communityView.sort = key;
        communityView.dir = 1;
      }
      refreshCommunity();
    });

    // Filtro e ordenacao trocam so a tabela: o campo de busca, o seletor e o
    // checkbox ficam no mesmo elemento, entao nao perdem foco nem cursor.
    function refreshCommunity() {
      if (!lastParsed || lastParsed.type !== "bgp_community") return;
      const host = document.getElementById("community-body");
      if (!host) return;
      host.innerHTML = communityBody(lastParsed, communityView);
      const all = communityRows(lastParsed);
      const shown = all.filter((row) => communityMatches(row, communityView)).length;
      const count = document.getElementById("community-count");
      if (count) {
        count.textContent = `${shown} de ${all.length} prefixo${all.length === 1 ? "" : "s"}`;
      }
    }

    $device.addEventListener("change", loadCommands);
    $command.addEventListener("change", renderParamField);
    $form.addEventListener("submit", execute);

    loadSite();
    loadDevices();
  </script>
</body>

</html>
