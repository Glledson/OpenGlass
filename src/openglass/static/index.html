<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGlass</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --muted: color-mix(in srgb, var(--text) 62%, transparent);
      --border: color-mix(in srgb, var(--text) 16%, transparent);
      --field: color-mix(in srgb, var(--bg) 55%, var(--card));
      --ok: #22c55e;
      --err: #f87171;
      --warn: #f59e0b;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 50% -12%,
          color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 44px 18px 64px;
    }

    main {
      width: 100%;
      max-width: 880px;
    }

    /* ---------- Hero ---------- */
    header.hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    #logo {
      max-height: 280px;
      max-width: 510px;
      width: auto;
      height: auto;
      filter: drop-shadow(0 100% 0px rgba(0, 0, 0, .45));
    }

    h1 {
      font-size: 2rem;
      font-weight: 750;
      letter-spacing: -0.025em;
      margin: 0;
    }

    h1 span {
      color: var(--accent);
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: .95rem;
    }

    /* ---------- Card ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 45px -22px rgba(0, 0, 0, .75);
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: .72rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font-size: .95rem;
      transition: border-color .15s, box-shadow .15s;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    input:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button#run {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #05263a;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      transition: filter .15s, transform .05s;
    }

    button#run:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    button#run:active:not(:disabled) {
      transform: translateY(1px);
    }

    button#run:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(5, 38, 58, .35);
      border-top-color: #05263a;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- Status ---------- */
    #status {
      min-height: 20px;
      margin-top: 16px;
      font-size: .87rem;
      color: var(--muted);
    }

    #status.err {
      color: var(--err);
    }

    #status.ok {
      color: var(--ok);
    }

    #status code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
    }

    /* ---------- Resultado (terminal) ---------- */
    .result {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: color-mix(in srgb, var(--bg) 82%, black);
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: color-mix(in srgb, var(--text) 6%, transparent);
      border-bottom: 1px solid var(--border);
    }

    .dots {
      display: inline-flex;
      gap: 6px;
    }

    .dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
    }

    .result-title {
      font-size: .74rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-right: auto;
    }

    #copy {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .76rem;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    #copy:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    pre#output {
      margin: 0;
      padding: 16px 18px;
      max-height: 480px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---------- Saída bruta (recolhível) ---------- */
    details.raw {
      border-top: 1px solid var(--border);
    }

    details.raw>summary {
      cursor: pointer;
      list-style: none;
      padding: 11px 16px;
      font-size: .74rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      user-select: none;
    }

    details.raw>summary::-webkit-details-marker {
      display: none;
    }

    details.raw>summary::before {
      content: "▸ ";
    }

    details.raw[open]>summary::before {
      content: "▾ ";
    }

    details.raw>summary:hover {
      color: var(--accent);
    }

    /* ---------- Resultado tratado (ping) ---------- */
    .parsed {
      padding: 18px;
    }

    .ping-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .badge.success {
      color: #052e16;
      background: var(--ok);
    }

    .badge.partial {
      color: #3b2500;
      background: var(--warn);
    }

    .badge.failed {
      color: #450a0a;
      background: var(--err);
    }

    .ping-pct {
      font-size: 1.65rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .ping-pct span {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
      margin-left: 6px;
    }

    .ping-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 36px;
      margin: 0 0 16px;
    }

    .ping-meta div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ping-meta dt {
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .ping-meta dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .95rem;
    }

    .probes {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
    }

    .probe {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 750;
      font-size: .9rem;
      border: 1px solid var(--border);
    }

    .probe.reply {
      color: #052e16;
      background: color-mix(in srgb, var(--ok) 85%, transparent);
      border-color: transparent;
    }

    .probe.timeout {
      color: #450a0a;
      background: color-mix(in srgb, var(--err) 80%, transparent);
      border-color: transparent;
    }

    .probe.warn {
      color: #3b2500;
      background: color-mix(in srgb, var(--warn) 82%, transparent);
      border-color: transparent;
    }

    .ping-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat span {
      display: block;
      font-size: .64rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .rtt h4 {
      margin: 0 0 10px;
      font-size: .7rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .rtt-row {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      font-size: .8rem;
    }

    .rtt-row>span {
      color: var(--muted);
    }

    .rtt-track {
      height: 8px;
      border-radius: 99px;
      background: var(--field);
      overflow: hidden;
    }

    .rtt-track>i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent),
          color-mix(in srgb, var(--accent) 55%, var(--ok)));
    }

    .rtt-row b {
      font-variant-numeric: tabular-nums;
    }

    .rtt-empty {
      color: var(--muted);
      font-size: .85rem;
      margin: 0;
    }

    /* ---------- Detalhe de prefixo BGP ---------- */
    .bgp-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .bgp-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .bgp-prefix {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .bgp-sub { font-size: .8rem; color: var(--muted); }
    .path-count {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--field);
      font-size: .76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .path-more {
      margin: 16px 0 10px;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }
    .path-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      background: var(--field);
    }
    .path-card + .path-card { margin-top: 12px; }
    .path-card.best {
      border-color: color-mix(in srgb, var(--ok) 55%, var(--border));
      background: color-mix(in srgb, var(--ok) 9%, var(--field));
    }
    .path-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .path-card.best .path-head { color: var(--ok); }
    .path-star { font-size: 1rem; }
    .path-idx {
      margin-left: auto;
      font-size: .72rem;
      font-weight: 650;
      color: var(--muted);
    }
    .path-attrs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 22px;
      margin: 0 0 12px;
    }
    .path-attrs div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .path-attrs dt {
      font-size: .64rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
    }
    .path-attrs dd { margin: 0; font-size: .88rem; word-break: break-word; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: var(--muted); font-size: .82rem; }
    .flags { display: flex; flex-wrap: wrap; gap: 6px; }
    .flag {
      font-size: .68rem;
      font-weight: 650;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .flag-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
    .flag-bad { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }

    /* ---------- Rodapé / links ---------- */
    nav#links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 14px;
      margin-top: 30px;
    }

    nav#links a,
    nav#links button {
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: .82rem;
      text-decoration: none;
      cursor: pointer;
      transition: color .15s;
    }

    nav#links a:hover,
    nav#links button:hover {
      color: var(--accent);
    }

    nav#links .sep {
      color: var(--border);
    }

    #menus {
      max-width: 620px;
      margin: 14px auto 0;
    }

    .menu-panel {
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: .88rem;
      line-height: 1.55;
      white-space: pre-wrap;
      color: var(--text);
    }

    .menu-panel h3 {
      margin: 0 0 6px;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    footer.foot {
      margin-top: 26px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 620px) {
      .form {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.7rem;
      }

      #logo {
        max-height: 130px;
      }

      .ping-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .ping-pct {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="hero">
      <img id="logo" class="hidden" alt="logo">
      <h1 id="site-title">OpenGlass</h1>
      <p class="sub" id="subtitle"></p>
    </header>

    <section class="card">
      <form class="form" id="query-form">
        <div class="field">
          <label for="device">Roteador</label>
          <select id="device"></select>
        </div>

        <div class="field">
          <label for="command">Comando</label>
          <select id="command"></select>
        </div>

        <div class="field full" id="param-field">
          <label for="param" id="param-label">IP</label>
          <input id="param" type="text" placeholder="8.8.8.8" autocomplete="off">
        </div>

        <button id="run" type="submit">
          <span class="spinner hidden" id="spinner"></span>
          <span id="run-label">Executar</span>
        </button>
      </form>
      <div id="status"></div>
    </section>

    <section class="result hidden" id="result">
      <div class="result-head">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="result-title">Resultado</span>
        <button id="copy" type="button">Copiar</button>
      </div>
      <div id="parsed" class="parsed hidden"></div>
      <details class="raw" id="raw">
        <summary>Ver saída bruta</summary>
        <pre id="output"></pre>
      </details>
    </section>

    <nav id="links"></nav>
    <div id="menus"></div>

    <footer class="foot" id="foot"></footer>
  </main>

  <script>
    const $device = document.getElementById("device");
    const $command = document.getElementById("command");
    const $paramLabel = document.getElementById("param-label");
    const $param = document.getElementById("param");
    const $form = document.getElementById("query-form");
    const $run = document.getElementById("run");
    const $runLabel = document.getElementById("run-label");
    const $spinner = document.getElementById("spinner");
    const $status = document.getElementById("status");
    const $result = document.getElementById("result");
    const $parsed = document.getElementById("parsed");
    const $raw = document.getElementById("raw");
    const $output = document.getElementById("output");
    const $copy = document.getElementById("copy");
    const $siteTitle = document.getElementById("site-title");
    const $subtitle = document.getElementById("subtitle");
    const $logo = document.getElementById("logo");
    const $links = document.getElementById("links");
    const $menus = document.getElementById("menus");
    const $foot = document.getElementById("foot");

    const LABELS = { destination: "IP", ip: "IP", prefix: "Prefixo", hostname: "Host" };
    let commands = [];

    async function api(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `Erro ${res.status}`);
      return data;
    }

    function setStatus(text, kind) {
      $status.innerHTML = text || "";
      $status.className = kind || "";
    }

    function setLoading(active) {
      $run.disabled = active;
      $spinner.classList.toggle("hidden", !active);
      $runLabel.textContent = active ? "Executando..." : "Executar";
    }

    function applyTheme(theme) {
      const colors = (theme && theme.colors) || {};
      const root = document.documentElement.style;
      if (colors.background) root.setProperty("--bg", colors.background);
      if (colors.secondary) root.setProperty("--card", colors.secondary);
      if (colors.text) root.setProperty("--text", colors.text);
      if (colors.primary) root.setProperty("--accent", colors.primary);
    }

    function logoSrc(path) {
      if (!path) return "";
      return `/static/${path.replace(/^static\//, "")}`;
    }

    function renderSite(site) {
      document.title = site.site_title || "OpenGlass";
      $siteTitle.textContent = site.site_title || "OpenGlass";
      $subtitle.textContent = site.subtitle || site.site_description || "";

      const logoPath = (site.logo && (site.logo.light || site.logo.dark)) || "";
      if (logoPath && (site.title_mode || "").includes("logo")) {
        $logo.alt = site.site_title || "logo";
        $logo.onload = () => {
          $logo.classList.remove("hidden");
          $siteTitle.classList.add("hidden");
        };
        $logo.src = logoSrc(logoPath);
      }
      if (site.logo && site.logo.favicon) {
        const link = document.createElement("link");
        link.rel = "icon";
        link.href = logoSrc(site.logo.favicon);
        document.head.appendChild(link);
      }

      applyTheme(site.theme);

      const links = site.links || [];
      const menus = site.menus || [];
      const parts = ['<span class="sep">|</span>'];
      links.forEach((l, i) => {
        parts.push(`<a href="${l.url}" target="_blank" rel="noopener">${l.title}</a>`);
        if (i < links.length - 1) parts.push('<span class="sep">·</span>');
      });
      const menuButtons = menus
        .map((m, i) => `<button type="button" data-menu="${i}">${m.title}</button>`)
        .join('<span class="sep">·</span>');
      $links.innerHTML = parts.join(" ") + (menus.length ? ` <span class="sep">|</span> ${menuButtons}` : "");

      $menus.innerHTML = menus
        .map(
          (m, i) =>
            `<div class="menu-panel hidden" id="menu-${i}"><h3>${m.title}</h3>${m.content}</div>`
        )
        .join("");
      $links.querySelectorAll("button[data-menu]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const panel = document.getElementById(`menu-${btn.dataset.menu}`);
          if (panel) panel.classList.toggle("hidden");
        });
      });

      const asn = site.primary_asn ? ` · AS${site.primary_asn}` : "";
      $foot.textContent = `${site.org_name || ""}${asn}`;
    }

    async function loadSite() {
      try {
        renderSite(await api("/api/site"));
      } catch (err) {
        console.warn("Falha ao carregar openglass.yaml:", err.message);
      }
    }

    function currentParam() {
      const cmd = commands.find((c) => c.name === $command.value);
      return cmd && cmd.params.length ? cmd.params[0] : null;
    }

    function renderParamField() {
      const param = currentParam();
      if (!param) {
        $paramLabel.textContent = "IP";
        $param.placeholder = "este comando não usa parâmetro";
        $param.value = "";
        $param.disabled = true;
        return;
      }
      $paramLabel.textContent = LABELS[param.type] || param.name;
      $param.placeholder = param.type === "prefix" ? "8.8.8.0/24" : "8.8.8.8";
      $param.disabled = false;
    }

    async function loadCommands() {
      const name = $device.value;
      if (!name) return;
      setStatus("Carregando comandos...");
      try {
        commands = await api(`/api/devices/${encodeURIComponent(name)}/commands`);
        $command.innerHTML = commands
          .map((c) => `<option value="${c.name}">${c.description}</option>`)
          .join("");
        renderParamField();
        setStatus("");
      } catch (err) {
        commands = [];
        $command.innerHTML = "";
        setStatus(err.message, "err");
      }
    }

    async function loadDevices() {
      setStatus("Carregando roteadores...");
      try {
        const devices = await api("/api/devices");
        $device.innerHTML = devices
          .map((d) => `<option value="${d.name}">${d.name} (${d.address})</option>`)
          .join("");
        setStatus("");
        await loadCommands();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    const PROBE_STYLE = {
      reply: { cls: "reply", glyph: "✓" },
      timeout: { cls: "timeout", glyph: "✕" },
      unreachable: { cls: "warn", glyph: "⚠" },
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function probeChip(probe) {
      const style = PROBE_STYLE[probe.result] || { cls: "warn", glyph: "•" };
      return `<span class="probe ${style.cls}" title="${esc(probe.label)}">${style.glyph}</span>`;
    }

    function pingCard(p) {
      const badges = {
        success: ["success", "✓ Sucesso"],
        partial: ["partial", "⚠ Parcial"],
        failed: ["failed", "✗ Falha"],
      };
      const [badgeCls, badgeText] = badges[p.status] || ["partial", esc(p.status)];

      const meta = [
        `<div><dt>Destino</dt><dd>${esc(p.target || "—")}</dd></div>`,
        p.source ? `<div><dt>Origem</dt><dd>${esc(p.source)}</dd></div>` : "",
      ].join("");

      let latency = `<p class="rtt-empty">Sem resposta — não foi possível medir a latência.</p>`;
      const rtt = p.rtt_ms;
      if (rtt) {
        const max = Math.max(rtt.min, rtt.avg, rtt.max, 1);
        const row = (label, value) => `
          <div class="rtt-row">
            <span>${label}</span>
            <div class="rtt-track"><i style="width:${Math.round((value / max) * 100)}%"></i></div>
            <b>${value} ms</b>
          </div>`;
        latency = `<div class="rtt">
          <h4>Latência (ida e volta)</h4>
          ${row("min", rtt.min)}${row("média", rtt.avg)}${row("máx", rtt.max)}
        </div>`;
      }

      return `
        <div class="ping-head">
          <span class="badge ${badgeCls}">${badgeText}</span>
          <span class="ping-pct">${p.success_percent}<span>% de sucesso</span></span>
        </div>
        <dl class="ping-meta">${meta}</dl>
        <div class="probes">${(p.probes || []).map(probeChip).join("")}</div>
        <div class="ping-stats">
          <div class="stat"><span>Enviados</span><strong>${p.sent}</strong></div>
          <div class="stat"><span>Recebidos</span><strong>${p.received}</strong></div>
          <div class="stat"><span>Perda</span><strong>${p.loss_percent}%</strong></div>
          <div class="stat"><span>Tempo limite</span><strong>${p.timeout_s != null ? p.timeout_s + "s" : "—"}</strong></div>
        </div>
        ${latency}`;
    }

    const FLAG_OK = new Set(["valid", "best", "sourced", "local", "multipath"]);
    const FLAG_BAD = new Set(["invalid", "stale", "history", "withdrawn", "suppressed", "damped", "rib-failure"]);

    function flagClass(flag) {
      const key = flag.toLowerCase();
      if (FLAG_OK.has(key)) return "flag-ok";
      if (FLAG_BAD.has(key)) return "flag-bad";
      return "";
    }

    function flagChips(flags) {
      return (flags || [])
        .map((flag) => `<span class="flag ${flagClass(flag)}">${esc(flag)}</span>`)
        .join("");
    }

    function pathCard(path, isBest) {
      const attrs = [];
      if (path.localpref != null) attrs.push(`localpref ${path.localpref}`);
      if (path.metric != null) attrs.push(`metric ${path.metric}`);
      if (path.weight != null) attrs.push(`weight ${path.weight}`);
      const originLine = [path.origin, ...attrs].filter(Boolean).join(" · ");

      const hasFrom = path.from && path.from !== "0.0.0.0";
      const from = hasFrom
        ? ` <span class="muted">(de ${esc(path.from)}${path.originator ? ` / ${esc(path.originator)}` : ""})</span>`
        : "";
      const aggregations = (path.aggregations || [])
        .map((a) => `<div><dt>Agregação</dt><dd class="mono">AS${esc(a.asn)} ${esc(a.router)}</dd></div>`)
        .join("");

      return `
        <div class="path-card ${isBest ? "best" : ""}">
          <div class="path-head">
            ${isBest ? '<span class="path-star">★</span> Melhor caminho' : "Caminho"}
            <span class="path-idx">#${path.index}</span>
          </div>
          <dl class="path-attrs">
            <div><dt>AS path</dt><dd class="mono">${esc(path.as_path_text || "—")}</dd></div>
            <div><dt>Next hop</dt><dd class="mono">${esc(path.next_hop)}${from}</dd></div>
            <div><dt>Origem</dt><dd>${esc(originLine || "—")}</dd></div>
            ${aggregations}
          </dl>
          <div class="flags">${flagChips(path.flags)}</div>
        </div>`;
    }

    function bgpPrefixCard(p) {
      if (p.status === "not_found") {
        return `
          <div class="bgp">
            <div class="bgp-head">
              <div class="bgp-title">
                <span class="bgp-prefix">${esc(p.prefix || "?")}</span>
                <span class="bgp-sub">consulta de detalhe BGP</span>
              </div>
              <span class="badge partial">⚠ Não encontrado</span>
            </div>
            <p class="rtt-empty">O prefixo não está na tabela BGP deste roteador.</p>
          </div>`;
      }

      const paths = p.paths || [];
      const best = paths.find((path) => path.best);
      const others = paths.filter((path) => path !== best);
      const advertise =
        p.advertised === false
          ? "não anunciado"
          : p.advertised && (p.update_groups || []).length
            ? `anunciado (ug ${p.update_groups.join(", ")})`
            : "";
      const sub = [
        p.version != null ? `versão ${p.version}` : "",
        p.table ? `tabela ${esc(p.table)}` : "",
        advertise,
      ].filter(Boolean).join(" · ");

      return `
        <div class="bgp">
          <div class="bgp-head">
            <div class="bgp-title">
              <span class="bgp-prefix">${esc(p.prefix || "?")}</span>
              <span class="bgp-sub">${sub}</span>
            </div>
            <span class="path-count">${p.available} path${p.available === 1 ? "" : "s"}</span>
          </div>
          ${best ? pathCard(best, true) : ""}
          ${others.length
            ? `<div class="path-more">Outros caminhos (${others.length})</div>${others
                .map((path) => pathCard(path, false))
                .join("")}`
            : ""}
        </div>`;
    }

    function renderParsed(parsed) {
      let html = "";
      if (parsed && parsed.type === "ping") {
        html = pingCard(parsed);
      } else if (parsed && parsed.type === "bgp_prefix") {
        html = bgpPrefixCard(parsed);
      }
      if (html) {
        $parsed.innerHTML = html;
        $parsed.classList.remove("hidden");
      } else {
        $parsed.innerHTML = "";
        $parsed.classList.add("hidden");
      }
    }

    async function execute(event) {
      if (event) event.preventDefault();
      const param = currentParam();
      const params = {};
      if (param) {
        const value = $param.value.trim();
        if (!value) {
          setStatus(`Informe o ${$paramLabel.textContent}.`, "err");
          $param.focus();
          return;
        }
        params[param.name] = value;
      }

      $result.classList.add("hidden");
      setLoading(true);
      setStatus("Executando no roteador... (pode levar alguns segundos)");

      try {
        const result = await api("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: $device.value, command: $command.value, params }),
        });
        setStatus("");
        $output.textContent = result.output;
        renderParsed(result.parsed);
        $raw.open = false;
        $result.classList.remove("hidden");
      } catch (err) {
        setStatus(err.message, "err");
      } finally {
        setLoading(false);
      }
    }

    $copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($output.textContent || "");
        $copy.textContent = "Copiado!";
        setTimeout(() => { $copy.textContent = "Copiar"; }, 1500);
      } catch (err) {
        setStatus("Não foi possível copiar.", "err");
      }
    });

    $device.addEventListener("change", loadCommands);
    $command.addEventListener("change", renderParamField);
    $form.addEventListener("submit", execute);

    loadSite();
    loadDevices();
  </script>
</body>

</html>
